<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Camera QR</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .box {
      text-align: center;
      padding: 30px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin: 20px auto;
      width: fit-content;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>📷 Scan to Open Camera</h1>

    <div id="qrcode"></div>

    <p>Mobile se QR code scan karein.</p>

  </div>

  <script src="./js/dashboard.js"></script>

</body>
</html>
