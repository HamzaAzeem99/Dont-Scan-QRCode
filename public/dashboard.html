<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera Dashboard</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- QRCode.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="dashboard-container">
    <h1>📷 Live Camera Dashboard</h1>
    <p class="subtitle">Scan the QR code with your mobile phone to stream live camera</p>

    <div id="status" class="status-badge waiting">⏳ Initializing session...</div>

    <div id="qr-section" class="card-section">
      <div id="qrcode-container">
        <div id="qrcode"></div>
      </div>
      <p style="margin-top: 10px; font-size: 0.9rem; color: #94a3b8;">
        Scan with your phone or open the link below on the camera device:
      </p>
      <div class="copy-link-box">
        <input type="text" id="cameraUrlInput" readonly value="">
        <button id="copyBtn" type="button">Copy</button>
      </div>
    </div>

    <div id="video-section" class="card-section" style="display: none;">
      <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
      <p class="info-note">WebRTC direct peer-to-peer stream active</p>
    </div>
  </div>

  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
