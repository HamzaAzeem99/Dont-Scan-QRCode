<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Camera Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard {
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    #qrcode {
      background: white;
      padding: 15px;
      width: fit-content;
      margin: 20px auto;
      border-radius: 12px;
    }

    #remoteVideo {
      width: 100%;
      max-width: 650px;
      background: #000;
      border-radius: 12px;
      display: none;
    }

    #status {
      margin: 15px;
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <h1>📷 Private Camera Dashboard</h1>

    <div id="qrcode"></div>

    <p id="status">Waiting for user...</p>

    <video id="remoteVideo" autoplay playsinline></video>

  </div>

  <script type="module" src="./js/dashboard.js"></script>

</body>
</html>
