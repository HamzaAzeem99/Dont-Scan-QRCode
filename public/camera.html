<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Camera</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 15px;
    }

    #localVideo {
      width: 100%;
      max-height: 80vh;
      object-fit: cover;
      background: #111;
    }

    button {
      margin: 15px 5px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #startBtn {
      background: #28a745;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }
  </style>
</head>

<body>

  <h1>📹 Camera</h1>

  <p id="session-info">Session: Loading...</p>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  ></video>

  <br>

  <button id="startBtn">
    📷 Allow Camera & Start
  </button>

  <button
    id="stopBtn"
    style="display:none;"
  >
    ⛔ Stop Camera
  </button>

  <script src="./js/camera.js"></script>

</body>
</html>
