<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Stream</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- Supabase CDN (UMD - window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="camera-container">
    <h1>📷 Camera Broadcaster</h1>
    <p class="subtitle">Grant camera permission to stream to the dashboard</p>

    <div id="status" class="status-badge waiting">Camera permission required</div>

    <div class="card-section">
      <button id="startBtn" class="btn btn-primary">
        Allow Camera & Start
      </button>

      <div id="localVideoWrapper" class="video-wrapper" style="display: none; margin-top: 16px;">
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <p id="streamInfo" class="info-note" style="display: none;">
        🔴 Streaming live to dashboard via WebRTC peer connection.
      </p>
    </div>
  </div>

  <script type="module" src="./js/camera.js"></script>
</body>
</html>
